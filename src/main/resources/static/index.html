<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<div class="main-grid">
    <div class="search-form">
<div>
    <h2 class="header-text">Register Form</h2>
</div>
        <form id="userForm" class="inputDetails">
            <div>
                <label for="name" class="nameLabel">
                   First Name
                </label>
                <input id="name" placeholder="Enter your first name" required type="text" class="inputName">
            </div>
            <div>
                <label for="lastName" class="lastNameLabel">
                    Last Name
                </label>
                <input id="lastName" class="lastNameInput" placeholder="Enter you last name" required type="text">
            </div>

            <div>
                <label for="email" class="emailHolder">
                   Email Address
                </label>
                <input id="email" class="inputEmail" required type="email" placeholder="Enter your mail"/>

            </div>
            <button type="submit" class="btnSubmit">Register User</button>
            </form>
                <p id="message" class="paragraph"></p>

        </div>

   </div>
<script>
    const userForm = document.getElementById("userForm");

    userForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const userData = {
            firstName: document.getElementById("name").value,
            lastName:document.getElementById("lastName").value,

            email: document.getElementById("email").value,
        };

        try {
            const response = await fetch("/api/v1/employees", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                },

                body: JSON.stringify(userData),
            });

            const responseText = await response.text();

            console.log("Status:", response.status);
            console.log("Response:", responseText);

            if (!response.ok) {
                throw new Error(`Server error ${response.status}: ${responseText}`);
            }

            const result = JSON.parse(responseText);

            document.getElementById("message").innerText =
                "User saved successfully! : " + result.firstName + " " + result.lastName;

            console.log(result.firstName + " " + result.lastName)

            userForm.reset();
        } catch (error) {
            console.error("Error:", error);

            document.getElementById("message").innerText = error.message;
        }
    });
</script>
</body>
</html>
